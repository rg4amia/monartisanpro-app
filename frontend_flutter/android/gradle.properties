org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=false
kotlin.incremental=false
# File-system watching déclenche « Already watching path » puis
# « invalidating VFS after an error happened » sur les runners GitHub
# (limites inotify), ce qui fait échouer `assembleRelease` sans produire
# d'APK. Le watching n'apporte rien en CI (build propre) ni au workflow
# Flutter local (hot reload ne passe pas par Gradle).
org.gradle.vfs.watch=false
# mergeReleaseNativeLibs traite chaque ABI (arm64-v8a, armeabi-v7a, x86_64)
# via l'API Worker de Gradle ; en parallèle sur plusieurs threads, la création
# concurrente des sous-dossiers out/lib/<abi> provoque un
# java.nio.file.AccessDeniedException systématique sous Windows
# (verrouillage de répertoire plus strict que sur Unix). Sérialisation des
# workers pour fiabiliser --split-per-abi en local.
org.gradle.workers.max=1