org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# File-system watching déclenche « Already watching path » puis
# « invalidating VFS after an error happened » sur les runners GitHub
# (limites inotify), ce qui fait échouer `assembleRelease` sans produire
# d'APK. Le watching n'apporte rien en CI (build propre) ni au workflow
# Flutter local (hot reload ne passe pas par Gradle).
org.gradle.vfs.watch=false