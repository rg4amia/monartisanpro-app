name: frontend_flutter
description: "ProsArtisan - Marketplace artisanal pour la Côte d'Ivoire"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State management & routing ───────────────────────────────────────────────
  get: ^4.7.2
  get_storage: ^2.1.1

  # ── HTTP & networking ────────────────────────────────────────────────────────
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.3.1
  http: ^1.2.2

  # ── JSON serialization ───────────────────────────────────────────────────────
  json_annotation: ^4.9.0

  # ── Local storage ────────────────────────────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.5

  # ── Maps & location ──────────────────────────────────────────────────────────
  yandex_maps_mapkit: ^4.7.1
  geolocator: ^14.0.3
  geocoding: ^4.0.0

  # ── Media ────────────────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # ── QR Code ──────────────────────────────────────────────────────────────────
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  exif: ^3.1.2

  # ── WebView & URLs ───────────────────────────────────────────────────────────
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1

  # ── Push notifications ───────────────────────────────────────────────────────
  onesignal_flutter: ^5.3.4

  # ── Charts ───────────────────────────────────────────────────────────────────
  fl_chart: ^1.2.0

  # ── UI helpers ───────────────────────────────────────────────────────────────
  shimmer: ^3.0.0
  dropdown_search: ^7.0.0

  # ── Utilities ────────────────────────────────────────────────────────────────
  intl: ^0.20.2
  uuid: ^4.5.1
  permission_handler: ^11.4.0
  cupertino_icons: ^1.0.8
  connectivity_plus: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/logo/
