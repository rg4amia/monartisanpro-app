name: Deploy to Production (Hostinger Optimized)

on:
  push:
    branches: [master, develop, new-dev-inz]
    paths:
      - "backend-proartisan/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master, develop, new-dev-inz]
    paths:
      - "backend-proartisan/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "backend-proartisan/package-lock.json"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, pdo, bcmath, zip
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: ./backend-proartisan
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend-proartisan/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        working-directory: ./backend-proartisan
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Environment
        working-directory: ./backend-proartisan
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Install Node dependencies
        working-directory: ./backend-proartisan
        run: npm ci

      - name: Build assets
        working-directory: ./backend-proartisan
        run: npm run build

      - name: Verify build
        working-directory: ./backend-proartisan
        run: |
          if [ ! -d "public/build" ]; then
            echo "❌ Build failed - assets not found"
            exit 1
          fi
          echo "✅ Assets built successfully"

      - name: Build Next.js Vitrine (Static Export)
        run: |
          cd vitrine-nextjs
          npm ci
          npm run build

      - name: Verify Next.js build
        run: |
          if [ ! -d "vitrine-nextjs/out" ]; then
            echo "❌ Next.js build failed"
            exit 1
          fi
          echo "✅ Next.js static files built successfully"

      - name: Prepare deployment artifacts
        working-directory: ./backend-proartisan
        run: |
          echo "📦 Preparing deployment artifacts..."
          echo "✅ Build artifacts ready for deployment"

      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 2m
          timeout: 60s
          script: |
            echo "✅ SSH connection successful!"
            echo "Server: $(hostname)"
            echo "User: $(whoami)"
            echo "Home: $HOME"
            echo "PHP: $(php -v | head -n 1)"

      - name: Deploy Git & PHP dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          timeout: 60s
          script: |
            set -e
            echo "🚀 Starting Git-based deployment..."
            DEPLOY_PATH="/home/${{ secrets.USERNAME }}/domains/prosartisan.net/public_html/monartisanpro-app"
            BACKEND_PATH="$DEPLOY_PATH/backend-proartisan"
            BRANCH="${{ github.ref_name }}"

            # Backup current .env
            if [ -f "$BACKEND_PATH/.env" ]; then
              cp "$BACKEND_PATH/.env" /home/${{ secrets.USERNAME }}/.env.backup
              echo "✅ .env backed up"
            fi

            # Initialize or update Git repository
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "📥 Cloning repository for first time..."
              mkdir -p "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
              git clone --branch $BRANCH https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              echo "🔄 Updating existing repository..."
              cd "$DEPLOY_PATH"
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git stash
              git fetch origin
              git reset --hard origin/$BRANCH
              git pull origin $BRANCH
            fi
            echo "✅ Git update completed"

            # Navigate to backend
            cd "$BACKEND_PATH"

            # Restore .env
            if [ -f "/home/${{ secrets.USERNAME }}/.env.backup" ]; then
              cp /home/${{ secrets.USERNAME }}/.env.backup "$BACKEND_PATH/.env"
              rm /home/${{ secrets.USERNAME }}/.env.backup
              echo "✅ .env restored"
            elif [ -f "$BACKEND_PATH/.env.prod" ]; then
              cp "$BACKEND_PATH/.env.prod" "$BACKEND_PATH/.env"
              echo "✅ Production .env copied"
            fi

            # Force Hostinger DB_HOST optimization (localhost)
            if [ -f "$BACKEND_PATH/.env" ]; then
              sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/g' "$BACKEND_PATH/.env"
              echo "✅ DB_HOST optimized to localhost"
            fi

            # Install dependencies
            echo "📦 Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

      - name: Copy built assets via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "backend-proartisan/public/build"
          target: "/home/${{ secrets.USERNAME }}/domains/prosartisan.net/public_html/monartisanpro-app"

      - name: Copy Next.js static files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "vitrine-nextjs/out/**"
          target: "/home/${{ secrets.USERNAME }}/domains/prosartisan.net/public_html"
          strip_components: 2

      - name: Finalize Laravel configuration
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          timeout: 60s
          script: |
            set -e
            DEPLOY_PATH="/home/${{ secrets.USERNAME }}/domains/prosartisan.net/public_html/monartisanpro-app"
            BACKEND_PATH="$DEPLOY_PATH/backend-proartisan"
            PUBLIC_HTML="/home/${{ secrets.USERNAME }}/domains/prosartisan.net/public_html"
            BRANCH="${{ github.ref_name }}"

            cd "$BACKEND_PATH"

            # Setup Laravel directories and permissions
            mkdir -p storage/{app/{public,private},framework/{cache/data,sessions,views,testing},logs}
            mkdir -p bootstrap/cache

            # Set proper permissions (ignore failures on files owned by webserver user)
            chmod -R 755 storage bootstrap/cache || true
            chmod -R 775 storage/logs || true
            find storage -type d -exec chmod 775 {} \; 2>/dev/null || true
            find storage -type f -exec chmod 664 {} \; 2>/dev/null || true

            # Laravel artisan commands
            php artisan key:generate --force 2>/dev/null || echo "⚠️ Key already exists"
            php artisan storage:link --force 2>/dev/null || echo "⚠️ Storage link exists"

            # Run migrations
            php artisan migrate --force || echo "⚠️ Migration issues - check manually"

            # Cache optimization
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan cache:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Configure root .htaccess to redirect to Laravel public folder
            echo "🔧 Configuring root .htaccess..."
            cat > "$PUBLIC_HTML/.htaccess" << 'EOF'
            <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # 1. ROUTAGE DU SOUS-DOMAINE API (api.prosartisan.net)
            # Redirige api.prosartisan.net vers Laravel public/
            RewriteCond %{HTTP_HOST} ^api\.prosartisan\.net$ [NC]
            RewriteCond %{REQUEST_URI} !^/monartisanpro-app/backend-proartisan/public/
            RewriteRule ^(.*)$ monartisanpro-app/backend-proartisan/public/$1 [L]

            # 2. ROUTAGE DE LARAVEL SUR LE DOMAINE PRINCIPAL (api, admin, sanctum, storage, build)
            # Permet d'accéder au panel admin, à l'API et aux assets Vite
            RewriteCond %{REQUEST_URI} ^/(api|admin|sanctum|storage|build) [NC]
            RewriteCond %{REQUEST_URI} !^/monartisanpro-app/backend-proartisan/public/
            RewriteRule ^(.*)$ monartisanpro-app/backend-proartisan/public/$1 [L]

            # 3. GESTION DES DOMAINES PRINCIPAUX (prosartisan.net / www.prosartisan.net)
            # Sert le Front Office statique Next.js (SSG)

            # Ignorer ces règles si l'hôte est api.prosartisan.net
            RewriteCond %{HTTP_HOST} !^api\.prosartisan\.net$ [NC]
            RewriteRule ^$ index.html [L]

            # Gestion de la page de détail d'actualités dynamique
            RewriteCond %{HTTP_HOST} !^api\.prosartisan\.net$ [NC]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^actualites/([^/]+)/?$ actualites/details.html [L]

            # Supprimer l'extension .html des URLs au premier niveau (ex: /supplier, /contact)
            RewriteCond %{HTTP_HOST} !^api\.prosartisan\.net$ [NC]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{DOCUMENT_ROOT}/$1.html -f
            RewriteRule ^([^/]+)/?$ $1.html [L]

            # Supprimer l'extension .html des URLs au second niveau (ex: /supplier/orders)
            RewriteCond %{HTTP_HOST} !^api\.prosartisan\.net$ [NC]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{DOCUMENT_ROOT}/$1/$2.html -f
            RewriteRule ^([^/]+)/([^/]+)/?$ $1/$2.html [L]
            </IfModule>
            EOF
            echo "✅ Root .htaccess configured"
            echo "✅ Deployment completed successfully!"
            echo "🌐 Site available at: https://prosartisan.net"
            echo "📌 Deployed branch: $BRANCH"
            echo "📌 Commit: ${{ github.sha }}"
