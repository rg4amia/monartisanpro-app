name: Deploy to Production (Hostinger Optimized)

on:
  push:
    branches: [master, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, pdo, bcmath, zip
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: ./backend
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        working-directory: ./backend
        run: composer install --no-dev --optimize-autoloader

      - name: Install Node dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build assets
        working-directory: ./backend
        run: npm run build

      - name: Verify build
        working-directory: ./backend
        run: |
          if [ ! -d "public/build" ]; then
            echo "❌ Build failed - assets not found"
            exit 1
          fi
          echo "✅ Assets built successfully"

      - name: Create optimized deployment archive
        working-directory: ./backend
        run: |
          echo "📦 Creating optimized archive..."
          tar -czf ../deploy.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='.kiro' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='*.log' \
            --exclude='*.md' \
            --exclude='README.md' \
            --exclude='CINETPAY_SANDBOX_TEST.md' \
            --exclude='FIREBASE_FCM_TEST.md' \
            --exclude='SMS_OTP_SANDBOX_TEST.md' \
            --exclude='package-lock.json' \
            --exclude='composer.lock' \
            --exclude='deploy.tar.gz' \
            --exclude='deploy-temp' \
            --exclude='storage/logs/*' \
            --exclude='bootstrap/cache/*' \
            --exclude='.editorconfig' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            .
          echo "✅ Archive created ($(du -h ../deploy.tar.gz | cut -f1))"

      - name: Test SSH Connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 2m
          timeout: 60s
          script: |
            echo "✅ SSH connection successful!"
            echo "Server: $(hostname)"
            echo "User: $(whoami)"
            echo "Home: $HOME"
            echo "PHP: $(php -v | head -n 1)"

      - name: Deploy to Hostinger
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          timeout: 60s
          script: |
            echo "🚀 Starting deployment on server..."

            DEPLOY_PATH="/home/${{ secrets.USERNAME }}/domains/prosartisan.net/public_html/monartisanpro-app/backend"
            PUBLIC_HTML="/home/${{ secrets.USERNAME }}/domains/prosartisan.net/public_html"

            # Backup existing installation
            if [ -d "$DEPLOY_PATH" ]; then
              BACKUP_DIR="/home/${{ secrets.USERNAME }}/backups/backup-$(date +%Y%m%d-%H%M%S)"
              mkdir -p /home/${{ secrets.USERNAME }}/backups
              cp -r "$DEPLOY_PATH" "$BACKUP_DIR"
              echo "✅ Backup created at $BACKUP_DIR"
            fi

            # Prepare directory
            mkdir -p "$DEPLOY_PATH"

            # Backup current .env
            if [ -f "$DEPLOY_PATH/.env" ]; then
              cp "$DEPLOY_PATH/.env" /home/${{ secrets.USERNAME }}/.env.backup
              echo "✅ .env backed up"
            fi

      - name: Upload archive
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "deploy.tar.gz"
          target: "/home/${{ secrets.USERNAME }}/"
          command_timeout: 30m
          timeout: 60s

      - name: Extract and configure Laravel
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          timeout: 60s
          script: |
            echo "🔧 Configuring Laravel application..."

            DEPLOY_PATH="/home/${{ secrets.USERNAME }}/domains/prosartisan.net/public_html/monartisanpro-app/backend"
            PUBLIC_HTML="/home/${{ secrets.USERNAME }}/domains/prosartisan.net/public_html"

            # Extract archive
            cd "$DEPLOY_PATH"

            # Remove old files but keep storage and .env
            find . -mindepth 1 -maxdepth 1 ! -name 'storage' ! -name '.env' -exec rm -rf {} +

            # Extract new files
            tar -xzf /home/${{ secrets.USERNAME }}/deploy.tar.gz -C "$DEPLOY_PATH"
            rm /home/${{ secrets.USERNAME }}/deploy.tar.gz

            # Restore .env
            if [ -f "/home/${{ secrets.USERNAME }}/.env.backup" ]; then
              cp /home/${{ secrets.USERNAME }}/.env.backup "$DEPLOY_PATH/.env"
              rm /home/${{ secrets.USERNAME }}/.env.backup
              echo "✅ .env restored"
            elif [ -f "/home/${{ secrets.USERNAME }}/.env.prod" ]; then
              cp /home/${{ secrets.USERNAME }}/.env.prod "$DEPLOY_PATH/.env"
              echo "✅ Production .env copied"
            else
              echo "⚠️  No .env file found - please configure manually"
            fi

            # Setup Laravel directories and permissions
            mkdir -p storage/{app/{public,private},framework/{cache/data,sessions,views,testing},logs}
            mkdir -p bootstrap/cache

            # Set proper permissions
            chmod -R 755 storage bootstrap/cache
            chmod -R 775 storage/logs

            # Ensure storage directories are writable
            find storage -type d -exec chmod 775 {} \;
            find storage -type f -exec chmod 664 {} \;

            # Laravel artisan commands
            php artisan key:generate --force 2>/dev/null || echo "⚠️  Key already exists"
            php artisan storage:link --force 2>/dev/null || echo "⚠️  Storage link exists"

            # Run migrations
            php artisan migrate --force || echo "⚠️  Migration issues - check manually"

            # Only seed on first deployment or if explicitly needed
            # php artisan db:seed --force 2>/dev/null || echo "⚠️  Seeder skipped"

            # Cache optimization
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan cache:clear

            # Rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Configure root .htaccess to redirect to Laravel public folder
            echo "🔧 Configuring root .htaccess..."
            cat > "$PUBLIC_HTML/.htaccess" << 'EOF'
            <IfModule mod_rewrite.c>
                RewriteEngine On
                
                # Redirect all requests to Laravel public folder
                RewriteCond %{REQUEST_URI} !^/monartisanpro-app/backend/public
                RewriteRule ^(.*)$ /monartisanpro-app/backend/public/$1 [L]
            </IfModule>
            EOF
            echo "✅ Root .htaccess configured"

            echo "✅ Deployment completed successfully!"
            echo "🌐 Site available at: https://prosartisan.net"
