name: Deploy to Production (Hostinger Optimized)

on:
  push:
    branches: [master, develop, new-dev-inz]
    paths:
      - "backend-proartisan/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master, develop, new-dev-inz]
    paths:
      - "backend-proartisan/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "backend-proartisan/package-lock.json"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, pdo, bcmath, zip
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: ./backend-proartisan
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend-proartisan/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        working-directory: ./backend-proartisan
        run: composer install --no-dev --optimize-autoloader

      - name: Install Node dependencies
        working-directory: ./backend-proartisan
        run: npm ci

      - name: Build assets
        working-directory: ./backend-proartisan
        run: npm run build

      - name: Verify build
        working-directory: ./backend-proartisan
        run: |
          if [ ! -d "public/build" ]; then
            echo "❌ Build failed - assets not found"
            exit 1
          fi
          echo "✅ Assets built successfully"

      - name: Prepare deployment artifacts
        working-directory: ./backend-proartisan
        run: |
          echo "📦 Preparing deployment artifacts..."
          echo "✅ Build artifacts ready for deployment"

      - name: Test SSH Connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 2m
          timeout: 60s
          script: |
            echo "✅ SSH connection successful!"
            echo "Server: $(hostname)"
            echo "User: $(whoami)"
            echo "Home: $HOME"
            echo "PHP: $(php -v | head -n 1)"

      - name: Deploy via Git and configure Laravel
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          timeout: 60s
          script: |
            echo "� Starting Git-based deployment..."

            DEPLOY_PATH="/home/${{ secrets.USERNAME }}/domains/prosartisan.net/public_html/monartisanpro-app"
            BACKEND_PATH="$DEPLOY_PATH/backend-proartisan"
            PUBLIC_HTML="/home/${{ secrets.USERNAME }}/domains/prosartisan.net/public_html"
            BRANCH="${{ github.ref_name }}"

            # Backup current .env
            if [ -f "$BACKEND_PATH/.env" ]; then
              cp "$BACKEND_PATH/.env" /home/${{ secrets.USERNAME }}/.env.backup
              echo "✅ .env backed up"
            fi

            # Initialize or update Git repository
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "📥 Cloning repository for first time..."
              mkdir -p "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
              git clone --branch $BRANCH https://github.com/${{ github.repository }}.git .
            else
              echo "🔄 Updating existing repository..."
              cd "$DEPLOY_PATH"
              
              # Stash any local changes
              git stash
              
              # Fetch latest changes
              git fetch origin
              
              # Reset to latest commit
              git reset --hard origin/$BRANCH
              
              # Pull latest changes
              git pull origin $BRANCH
            fi

            echo "✅ Git update completed"

            # Navigate to backend
            cd "$BACKEND_PATH"

            # Restore .env
            if [ -f "/home/${{ secrets.USERNAME }}/.env.backup" ]; then
              cp /home/${{ secrets.USERNAME }}/.env.backup "$BACKEND_PATH/.env"
              rm /home/${{ secrets.USERNAME }}/.env.backup
              echo "✅ .env restored"
            elif [ -f "/home/${{ secrets.USERNAME }}/.env.prod" ]; then
              cp /home/${{ secrets.USERNAME }}/.env.prod "$BACKEND_PATH/.env"
              echo "✅ Production .env copied"
            else
              echo "⚠️  No .env file found - please configure manually"
            fi

            # Install dependencies
            echo "📦 Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "📦 Installing Node dependencies..."
            npm ci

            echo "🔨 Building assets..."
            npm run build

            # Setup Laravel directories and permissions
            mkdir -p storage/{app/{public,private},framework/{cache/data,sessions,views,testing},logs}
            mkdir -p bootstrap/cache

            # Set proper permissions
            chmod -R 755 storage bootstrap/cache
            chmod -R 775 storage/logs

            # Ensure storage directories are writable
            find storage -type d -exec chmod 775 {} \;
            find storage -type f -exec chmod 664 {} \;

            # Laravel artisan commands
            php artisan key:generate --force 2>/dev/null || echo "⚠️  Key already exists"
            php artisan storage:link --force 2>/dev/null || echo "⚠️  Storage link exists"

            # Run migrations
            php artisan migrate --force || echo "⚠️  Migration issues - check manually"

            # Cache optimization
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan cache:clear

            # Rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Configure root .htaccess to redirect to Laravel public folder
            echo "🔧 Configuring root .htaccess..."
            cat > "$PUBLIC_HTML/.htaccess" << 'EOF'
            <IfModule mod_rewrite.c>
                RewriteEngine On
                
                # Redirect all requests to Laravel public folder
                RewriteCond %{REQUEST_URI} !^/monartisanpro-app/backend-proartisan/public
                RewriteRule ^(.*)$ /monartisanpro-app/backend-proartisan/public/$1 [L]
            </IfModule>
            EOF
            echo "✅ Root .htaccess configured"

            echo "✅ Deployment completed successfully!"
            echo "🌐 Site available at: https://prosartisan.net"
            echo "📌 Deployed branch: $BRANCH"
            echo "📌 Commit: ${{ github.sha }}"
