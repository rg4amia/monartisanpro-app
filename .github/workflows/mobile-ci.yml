name: Mobile CI

on:
  push:
    branches: [new-develop, new-dev-inz]
    paths:
      - "frontend_flutter/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [new-develop]
    paths:
      - "frontend_flutter/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Doit satisfaire `sdks` de frontend_flutter/pubspec.lock
          # (Flutter >= 3.38.4 / Dart >= 3.11.0).
          flutter-version: "3.41.6"
          channel: "stable"
          cache: true

      - name: Get dependencies
        working-directory: frontend_flutter
        run: flutter pub get

      - name: Analyze project source
        working-directory: frontend_flutter
        run: flutter analyze --fatal-infos

      # Tests unitaires / widget uniquement — les tests d'intégration
      # (test/integration, test/data/repositories) exigent un backend Laravel live.
      - name: Run unit & widget tests
        working-directory: frontend_flutter
        run: >-
          flutter test
          test/core test/data/models test/modules
          test/unit_tests_simple_test.dart test/widget_test.dart

  build-android:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          # Le plugin yandex_maps_mapkit compile son module Android en
          # Java 21 (sourceCompatibility/targetCompatibility = 21). Un JDK 17
          # ne peut pas lire ces .class → « cannot access YandexMapsPlugin »
          # lors de la compilation de GeneratedPluginRegistrant.
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: "stable"
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend_flutter/android/**/*.gradle*', 'frontend_flutter/android/**/gradle-wrapper.properties', 'frontend_flutter/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Get dependencies
        working-directory: frontend_flutter
        run: flutter pub get

      - name: Build APK (release)
        working-directory: frontend_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: frontend_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
