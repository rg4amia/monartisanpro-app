name: Mobile CI

on:
  push:
    branches: [new-develop, new-dev-inz]
    paths:
      - "frontend_flutter/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [new-develop]
    paths:
      - "frontend_flutter/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: "stable"

      - name: Get dependencies
        working-directory: frontend_flutter
        run: flutter pub get

      - name: Analyze project source
        working-directory: frontend_flutter
        run: flutter analyze

      # Tests unitaires / widget uniquement — les tests d'intégration
      # (test/integration, test/data/repositories) exigent un backend Laravel live.
      - name: Run unit & widget tests
        working-directory: frontend_flutter
        run: >-
          flutter test
          test/core test/data/models
          test/unit_tests_simple_test.dart test/widget_test.dart

  build-android:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: "stable"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Get dependencies
        working-directory: frontend_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: frontend_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: frontend_flutter/build/app/outputs/flutter-apk/app-release.apk
