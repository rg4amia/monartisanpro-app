name: Mobile CI

on:
  push:
    branches: [new-develop, new-dev-inz]
    paths:
      - "frontend_flutter/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [new-develop]
    paths:
      - "frontend_flutter/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Doit satisfaire `sdks` de frontend_flutter/pubspec.lock
          # (Flutter >= 3.38.4 / Dart >= 3.11.0).
          flutter-version: "3.41.6"
          channel: "stable"
          cache: true

      - name: Get dependencies
        working-directory: frontend_flutter
        run: flutter pub get

      - name: Analyze project source
        working-directory: frontend_flutter
        run: flutter analyze --fatal-infos

      # Tests unitaires / widget uniquement — les tests d'intégration
      # (test/integration, test/data/repositories) exigent un backend Laravel live.
      - name: Run unit & widget tests
        working-directory: frontend_flutter
        run: >-
          flutter test
          test/core test/data/models test/modules
          test/unit_tests_simple_test.dart test/widget_test.dart

  build-android:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      # Le build release (R8 + dexing + fusion des .so du SDK Yandex Maps,
      # ~200 Mo de natifs) fait un pic mémoire qui dépasse les ~16 Go du
      # runner : le daemon Gradle est tué par l'OOM-killer sans rien logger
      # (pas de « BUILD FAILED », juste des processus java orphelins puis
      # « Gradle build failed to produce an .apk file »). On remplace le
      # swapfile de 4 Go du runner par 12 Go pour absorber le pic.
      - name: Étendre le swap (anti OOM-killer)
        continue-on-error: true
        run: |
          set -x
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          sudo fallocate -l 12G /mnt/swapfile \
            || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288 status=none
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          swapon --show || true
          free -h || true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          # Le plugin yandex_maps_mapkit compile son module Android en
          # Java 21 (sourceCompatibility/targetCompatibility = 21). Un JDK 17
          # ne peut pas lire ces .class → « cannot access YandexMapsPlugin »
          # lors de la compilation de GeneratedPluginRegistrant.
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: "stable"
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend_flutter/android/**/*.gradle*', 'frontend_flutter/android/**/gradle-wrapper.properties', 'frontend_flutter/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Get dependencies
        working-directory: frontend_flutter
        run: flutter pub get

      - name: Build APK (release)
        working-directory: frontend_flutter
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tail -n 120 || FLUTTER_RC=$?
          echo "::group::APK réellement produits sur le disque"
          find . \( -name '*.apk' -o -name '*.aab' \) -exec ls -la {} \; 2>/dev/null || true
          echo "--- répertoires de sortie ---"
          find build android/app/build -type d \( -name 'flutter-apk' -o -name 'apk' -o -name 'bundle' \) 2>/dev/null || true
          echo "::endgroup::"
          # Contournement : si l'APK existe (côté AGP) mais pas là où Flutter
          # le cherche, on le recopie et on considère le build réussi.
          AGP_APK="android/app/build/outputs/apk/release/app-release.apk"
          WANT="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$WANT" ] && [ -f "$AGP_APK" ]; then
            echo "APK trouvé côté AGP mais absent de $WANT — recopie."
            mkdir -p "$(dirname "$WANT")"
            cp "$AGP_APK" "$WANT"
          fi
          if [ -f "$WANT" ]; then
            echo "APK OK : $WANT"
            exit 0
          fi
          echo "::error::Aucun APK produit."
          exit "${FLUTTER_RC:-1}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: frontend_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
