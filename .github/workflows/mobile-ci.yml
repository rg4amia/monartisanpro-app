name: Mobile CI

on:
  push:
    branches: [new-develop, new-dev-inz]
    paths:
      - "frontend_flutter/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [new-develop]
    paths:
      - "frontend_flutter/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Doit satisfaire `sdks` de frontend_flutter/pubspec.lock
          # (Flutter >= 3.38.4 / Dart >= 3.11.0).
          flutter-version: "3.41.6"
          channel: "stable"
          cache: true

      - name: Get dependencies
        working-directory: frontend_flutter
        run: flutter pub get

      - name: Analyze project source
        working-directory: frontend_flutter
        run: flutter analyze --fatal-infos

      # Tests unitaires / widget uniquement — les tests d'intégration
      # (test/integration, test/data/repositories) exigent un backend Laravel live.
      - name: Run unit & widget tests
        working-directory: frontend_flutter
        run: >-
          flutter test
          test/core test/data/models test/modules
          test/unit_tests_simple_test.dart test/widget_test.dart

  build-android:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: "stable"
          cache: true

      - name: Get dependencies
        working-directory: frontend_flutter
        run: flutter pub get

      # Le build APK release dépend d'artefacts natifs (yandex_maps_mapkit,
      # geolocator, onesignal) téléchargés au moment du build Gradle. Tant que
      # l'environnement CI n'est pas stabilisé pour ces dépendances, l'échec ne
      # doit pas bloquer la CI : la porte qualité est le job `test`
      # (analyze --fatal-infos + tests). `--verbose` rend l'échec diagnosticable.
      - name: Build APK (release)
        id: build_apk
        continue-on-error: true
        working-directory: frontend_flutter
        run: flutter build apk --release --verbose

      - name: Upload APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: frontend_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
