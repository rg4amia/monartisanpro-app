name: Mobile CI

on:
  push:
    branches: [new-develop, new-dev-inz]
    paths:
      - "frontend_flutter/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [new-develop]
    paths:
      - "frontend_flutter/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Doit satisfaire `sdks` de frontend_flutter/pubspec.lock
          # (Flutter >= 3.38.4 / Dart >= 3.11.0).
          flutter-version: "3.41.6"
          channel: "stable"
          cache: true

      - name: Get dependencies
        working-directory: frontend_flutter
        run: flutter pub get

      - name: Analyze project source
        working-directory: frontend_flutter
        run: flutter analyze --fatal-infos

      # Tests unitaires / widget uniquement — les tests d'intégration
      # (test/integration, test/data/repositories) exigent un backend Laravel live.
      - name: Run unit & widget tests
        working-directory: frontend_flutter
        run: >-
          flutter test
          test/core test/data/models test/modules
          test/unit_tests_simple_test.dart test/widget_test.dart

  build-android:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: "stable"
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend_flutter/android/**/*.gradle*', 'frontend_flutter/android/**/gradle-wrapper.properties', 'frontend_flutter/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Get dependencies
        working-directory: frontend_flutter
        run: flutter pub get

      # Le build tire des artefacts natifs volumineux (yandex_maps_mapkit,
      # geolocator, onesignal) au moment de Gradle : la résolution est
      # intermittente sur les runners. On réessaie jusqu'à 3 fois, la dernière
      # tentative en --verbose pour diagnostiquer un échec persistant.
      - name: Build APK (release)
        working-directory: frontend_flutter
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "::group::Build APK — tentative $attempt/3"
            if [ "$attempt" -eq 3 ]; then
              flutter build apk --release --verbose
            else
              flutter build apk --release
            fi
            code=$?
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            echo "Tentative $attempt échouée (code $code), nouvelle tentative dans 20s…"
            sleep 20
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: frontend_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
