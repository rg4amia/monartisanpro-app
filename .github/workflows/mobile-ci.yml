name: Mobile CI

on:
  push:
    branches: [new-dev-inz]
    paths:
      - "frontend_flutter/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [new-dev-inz]
    paths:
      - "frontend_flutter/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Doit satisfaire `sdks` de frontend_flutter/pubspec.lock
          # (Flutter >= 3.38.4 / Dart >= 3.11.0).
          flutter-version: "3.41.6"
          channel: "stable"
          cache: true

      - name: Get dependencies
        working-directory: frontend_flutter
        run: flutter pub get

      - name: Analyze project source
        working-directory: frontend_flutter
        run: flutter analyze --fatal-infos

      # Toute la suite : les tests étiquetés `integration` (backend Laravel
      # live) sont ignorés par dart_test.yaml. Aucune liste de dossiers à
      # maintenir : un nouveau fichier de test est exécuté d'office.
      - name: Run unit & widget tests
        working-directory: frontend_flutter
        run: flutter test

  build-android:
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          # Le plugin yandex_maps_mapkit compile son module Android en
          # Java 21 (sourceCompatibility/targetCompatibility = 21). Un JDK 17
          # ne peut pas lire ces .class → « cannot access YandexMapsPlugin »
          # lors de la compilation de GeneratedPluginRegistrant.
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: "stable"
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend_flutter/android/**/*.gradle*', 'frontend_flutter/android/**/gradle-wrapper.properties', 'frontend_flutter/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Get dependencies
        working-directory: frontend_flutter
        run: flutter pub get

      # Secrets injectés au build (jamais commités). Définir dans
      # Settings → Secrets → Actions : YANDEX_MAPKIT_API_KEY,
      # YANDEX_DISTANCE_MATRIX_API_KEY, YANDEX_GEOLOCATION_API_KEY.
      # OSRM_BASE_URL : optionnel — pointer vers une instance OSRM dédiée
      # (ex. https://osrm.prosartisan.net) pour des itinéraires fiables ;
      # sans secret, on retombe sur le serveur de démonstration public
      # (rate-limité, souvent injoignable depuis l'Afrique de l'Ouest).
      - name: Inject build secrets
        working-directory: frontend_flutter
        env:
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
          YANDEX_DISTANCE_MATRIX_API_KEY: ${{ secrets.YANDEX_DISTANCE_MATRIX_API_KEY }}
          YANDEX_GEOLOCATION_API_KEY: ${{ secrets.YANDEX_GEOLOCATION_API_KEY }}
          OSRM_BASE_URL: ${{ secrets.OSRM_BASE_URL || 'https://router.project-osrm.org' }}
        run: |
          OSRM_URL="${OSRM_BASE_URL:-https://router.project-osrm.org}"
          if [ -z "${YANDEX_MAPKIT_API_KEY}" ]; then
            echo "::warning::YANDEX_MAPKIT_API_KEY absent des secrets — la carte Yandex n'affichera aucune tuile dans cet APK."
          fi
          cat > env.json <<EOF
          {
            "YANDEX_MAPKIT_API_KEY": "${YANDEX_MAPKIT_API_KEY}",
            "YANDEX_DISTANCE_MATRIX_API_KEY": "${YANDEX_DISTANCE_MATRIX_API_KEY}",
            "YANDEX_GEOLOCATION_API_KEY": "${YANDEX_GEOLOCATION_API_KEY}",
            "OSRM_BASE_URL": "${OSRM_URL}"
          }
          EOF
          echo "yandex.mapkit.apiKey=${YANDEX_MAPKIT_API_KEY}" >> android/local.properties

      - name: Build APK (release)
        working-directory: frontend_flutter
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: frontend_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
