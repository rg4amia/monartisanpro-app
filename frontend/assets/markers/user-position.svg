<svg
    xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
    <!-- Outer shadow circle -->
    <circle
    cx="32" cy="32" r="24" fill="#4F46E5" fill-opacity="0.2"/>

    <!-- Middle circle -->
    <circle
    cx="32" cy="32" r="16" fill="#4F46E5" fill-opacity="0.4"/>

    <!-- Inner circle -->
    <circle
    cx="32" cy="32" r="8" fill="#4F46E5"/>

    <!-- Center dot -->
    <circle
    cx="32" cy="32" r="3" fill="#FFFFFF"/>

    <!-- Pulsing animation circles -->
    <circle cx="32" cy="32" r="28" fill="none" stroke="#4F46E5" stroke-width="1" stroke-opacity="0.3">
        <animate attributeName="r" from="28" to="32" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" from="0.3" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="32" cy="32" r="24" fill="none" stroke="#4F46E5" stroke-width="1" stroke-opacity="0.2">
        <animate attributeName="r" from="24" to="28" dur="2s" repeatCount="indefinite" begin="0.5s"/>
        <animate attributeName="stroke-opacity" from="0.2" to="0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
</svg>
